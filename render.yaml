services:
  - type: web
    name: alia-ai-companion
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: ALIA_DB_PATH
        value: /tmp/alia/alia.db
      - key: ALIA_RETENTION_DAYS
        value: "7"
      - key: ALLOWED_ORIGINS
        value: https://alia-ai-companion.onrender.com
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: BETA_ACCESS_TOKEN
        sync: false
