services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      ALLOWED_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN to your domain}
      ALIA_DB_PATH: /app/data/alia.db
      ALIA_RETENTION_DAYS: ${ALIA_RETENTION_DAYS:-30}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      BETA_ACCESS_TOKEN: ${BETA_ACCESS_TOKEN:?Set BETA_ACCESS_TOKEN}
    volumes:
      - alia-data:/app/data
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to your domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
volumes:
  alia-data:
  caddy-data:
  caddy-config:
