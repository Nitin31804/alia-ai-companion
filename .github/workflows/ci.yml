name: Verify Alia
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: python -m unittest discover -s . -p 'test_*.py' -v
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Build the single-service interview demo image
        run: docker build -f Dockerfile.render -t alia-render .
      - name: Verify the interview demo image
        run: |
          docker run -d --name alia-render-test -p 10000:10000 \
            -e APP_ENV=production \
            -e ALLOWED_ORIGINS=https://alia-ai-companion.onrender.com \
            -e BETA_ACCESS_TOKEN=ci-only-beta-token-at-least-32-characters \
            -e GROQ_API_KEY=ci-only-not-a-real-provider-key \
            alia-render
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:10000/
          curl --fail http://127.0.0.1:10000/health
      - name: Stop the interview demo image
        if: always()
        run: docker rm -f alia-render-test || true
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and start application containers
        run: docker compose up --build -d
      - name: Wait for the application
        run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:5173/health
      - run: npm run test:e2e
        working-directory: frontend
      - name: Collect container logs
        if: always()
        run: docker compose logs --no-color > container.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alia-e2e-evidence
          if-no-files-found: warn
          path: |
            container.log
            frontend/test-results/alia-dashboard.png
            frontend/test-results/alia-privacy.png
            frontend/playwright-report/
