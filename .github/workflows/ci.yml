name: Verify Alia
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: python -m unittest discover -s . -p 'test_*.py' -v
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and start application containers
        run: docker compose up --build -d
      - name: Wait for the application
        run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:5173/health
      - run: npm run test:e2e
        working-directory: frontend
      - name: Collect container logs
        if: always()
        run: docker compose logs --no-color > container.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alia-e2e-evidence
          if-no-files-found: warn
          path: |
            container.log
            frontend/test-results/alia-dashboard.png
            frontend/playwright-report/
